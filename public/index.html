<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orange Cafe – Kitchen Staff App</title>
  <link rel="shortcut icon" href="/assets/images/favicon.png" type="image/png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Socket.io Client -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  
  <!-- React & Babel for standalone execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- PDF Generation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .font-heading { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen selection:bg-orange-500 selection:text-white">
  <div id="root"></div>

  <!-- Staff Application Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PRESET_IMAGES = [
      { name: 'Pizza', url: '/assets/images/pizza.png' },
      { name: 'Burger', url: '/assets/images/burger.png' },
      { name: 'Sandwich', url: '/assets/images/sandwich.png' },
      { name: 'Fries', url: '/assets/images/fries.png' },
      { name: 'Pasta', url: '/assets/images/pasta.png' },
      { name: 'Drinks', url: '/assets/images/drinks.png' },
      { name: 'Combo Meal', url: '/assets/images/combo.png' },
      { name: 'Hero Banner', url: '/assets/images/hero_cafe.png' }
    ];

    function StaffApp() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [pin, setPin] = useState('');
      const [loginError, setLoginError] = useState('');

      const [orders, setOrders] = useState([]);
      const [orderTypeFilter, setOrderTypeFilter] = useState('all'); // 'all' | 'dine_in' | 'online' | 'reservations' | 'history' | 'menu_stock' | 'pos_create'
      const [statusFilter, setStatusFilter] = useState('all');

      // Table Reservations System State
      const [reservations, setReservations] = useState([]);

      // Dynamic Menu & Stock State
      const [menuCategories, setMenuCategories] = useState([]);
      const [menuItems, setMenuItems] = useState([]);
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('all');
      const [menuSearchQuery, setMenuSearchQuery] = useState('');
      const [stockMap, setStockMap] = useState({});

      // Suggestions Catalog for Item Creation Autocomplete
      const [itemSuggestions, setItemSuggestions] = useState([]);
      const [showSuggestions, setShowSuggestions] = useState(false);

      // Modals State
      const [isAddItemModalOpen, setIsAddItemModalOpen] = useState(false);
      const [isEditItemModalOpen, setIsEditItemModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      // 3-Step Safe Delete Modal State
      const [deleteTargetItem, setDeleteTargetItem] = useState(null);
      const [deleteConfirmStep, setDeleteConfirmStep] = useState(1);
      const [deleteConfirmText, setDeleteConfirmText] = useState('');

      // Add Item Form State
      const [newItemForm, setNewItemForm] = useState({
        name: '',
        category: 'pizzas',
        newCategoryName: '',
        price: '',
        mediumPrice: '',
        description: '',
        image: '/assets/images/pizza.png',
        isBogoEligible: true,
        isVeg: true
      });

      // POS Staff Walk-In Order State
      const [posOrderType, setPosOrderType] = useState('dine_in'); // 'dine_in' | 'online'
      const [posTableNum, setPosTableNum] = useState('1');
      const [posCustomerName, setPosCustomerName] = useState('Walk-In Customer');
      const [posPhone, setPosPhone] = useState('');
      const [posPaymentMethod, setPosPaymentMethod] = useState('Cash (Paid)'); // 'Cash (Paid)' | 'UPI at Counter' | 'Pay Later'
      const [posCart, setPosCart] = useState([]); // [{ item, quantity, size: 'Regular'|'Medium' }]

      // Past History State
      const [pastHistory, setPastHistory] = useState([]);
      const [selectedPastDate, setSelectedPastDate] = useState(null);
      const [selectedDateOrders, setSelectedDateOrders] = useState([]);
      const [loadingHistory, setLoadingHistory] = useState(false);
      const [historySearchQuery, setHistorySearchQuery] = useState('');

      const [isConnected, setIsConnected] = useState(false);
      const [isMuted, setIsMuted] = useState(false);

      // Live Timer Engine
      const [now, setNow] = useState(Date.now());
      useEffect(() => {
        const timer = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(timer);
      }, []);

      const getElapsedTime = (createdAt) => {
        if (!createdAt) return { text: '0m 0s', status: 'green' };
        const diffMs = Math.max(0, now - new Date(createdAt).getTime());
        const totalSec = Math.floor(diffMs / 1000);
        const mins = Math.floor(totalSec / 60);
        const secs = totalSec % 60;
        let status = 'green';
        if (mins >= 10) status = 'red';
        else if (mins >= 5) status = 'amber';
        return { text: `${mins}m ${secs}s`, status };
      };

      const audioCtxRef = useRef(null);

      // Web Audio Chime Engine
      const playOrderAlertSound = () => {
        if (isMuted) return;
        try {
          if (!audioCtxRef.current) {
            audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
          }
          const ctx = audioCtxRef.current;
          if (ctx.state === 'suspended') ctx.resume();

          const nowT = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sine';
          osc2.type = 'triangle';
          osc1.frequency.setValueAtTime(587.33, nowT);
          osc2.frequency.setValueAtTime(880.00, nowT);
          osc1.frequency.exponentialRampToValueAtTime(1174.66, nowT + 0.3);

          gain.gain.setValueAtTime(0.3, nowT);
          gain.gain.exponentialRampToValueAtTime(0.01, nowT + 0.5);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(nowT);
          osc2.start(nowT);
          osc1.stop(nowT + 0.5);
          osc2.stop(nowT + 0.5);
        } catch (e) {}
      };

      // Load Dynamic Menu & Stock
      const fetchMenuAndStock = async () => {
        try {
          const res = await fetch('/api/menu');
          const data = await res.json();
          if (data.success) {
            setMenuCategories(data.categories || []);
            setMenuItems(data.items || []);
            // Backup to local storage
            try {
              localStorage.setItem('orange_cafe_menu_backup', JSON.stringify(data));
            } catch(e) {}
          }
        } catch (e) {
          // Backup fallback from localStorage
          try {
            const backup = localStorage.getItem('orange_cafe_menu_backup');
            if (backup) {
              const parsed = JSON.parse(backup);
              setMenuCategories(parsed.categories || []);
              setMenuItems(parsed.items || []);
            }
          } catch(err) {}
        }

        try {
          const res = await fetch('/api/stock');
          const data = await res.json();
          if (data.success) setStockMap(data.stock || {});
        } catch (e) {}

        try {
          const res = await fetch('/api/menu/suggestions');
          const data = await res.json();
          if (data.success) setItemSuggestions(data.suggestions || []);
        } catch (e) {}
      };

      // Fetch Today's Orders & Reservations
      const fetchInitialData = async () => {
        try {
          const [ordersRes, resRes] = await Promise.all([
            fetch('/api/orders'),
            fetch('/api/reservations')
          ]);
          const ordersData = await ordersRes.json();
          const resData = await resRes.json();

          if (ordersData.success) setOrders(ordersData.orders || []);
          if (resData.success) setReservations(resData.reservations || []);
        } catch (e) {}
        fetchMenuAndStock();
      };

      // Socket.io Real-Time Synchronization
      useEffect(() => {
        if (!isLoggedIn) return;
        fetchInitialData();

        const socket = io();
        socket.on('connect', () => setIsConnected(true));
        socket.on('disconnect', () => setIsConnected(false));

        socket.on('order:new', (newOrder) => {
          setOrders((prev) => [newOrder, ...prev.filter(o => o.id !== newOrder.id)]);
          playOrderAlertSound();
        });

        socket.on('order:status_update', (updatedOrder) => {
          setOrders((prev) => prev.map((o) => (o.id === updatedOrder.id ? updatedOrder : o)));
        });

        socket.on('reservation:new', (newRes) => {
          setReservations((prev) => [newRes, ...prev]);
          playOrderAlertSound();
        });

        socket.on('reservation:status_update', (updatedRes) => {
          setReservations((prev) => prev.map((r) => (r.id === updatedRes.id ? updatedRes : r)));
        });

        socket.on('stock:update', (updatedStock) => {
          setStockMap(updatedStock);
        });

        socket.on('menu:update', (store) => {
          if (store) {
            setMenuCategories(store.categories || []);
            setMenuItems(store.items || []);
          }
        });

        const pollingTimer = setInterval(fetchInitialData, 5000);

        return () => {
          socket.disconnect();
          clearInterval(pollingTimer);
        };
      }, [isLoggedIn]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (pin === '1234') {
          setIsLoggedIn(true);
          setLoginError('');
        } else {
          setLoginError('Invalid Staff PIN! Please try 1234.');
        }
      };

      const updateStatus = async (order, nextStatus) => {
        try {
          const res = await fetch(`/api/orders/${order.id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: nextStatus })
          });
          const data = await res.json();
          if (data.success) {
            setOrders((prev) => prev.map((o) => (o.id === order.id ? data.order : o)));
          }
        } catch (e) {}
      };

      const updateReservationStatus = async (resItem, nextStatus) => {
        try {
          const res = await fetch(`/api/reservations/${resItem.id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: nextStatus })
          });
          const data = await res.json();
          if (data.success) {
            setReservations((prev) => prev.map((r) => (r.id === resItem.id ? data.reservation : r)));
          }
        } catch (e) {}
      };

      const fetchPastHistory = async () => {
        setLoadingHistory(true);
        try {
          const res = await fetch('/api/orders/history');
          const data = await res.json();
          if (data.success) setPastHistory(data.history || []);
        } catch (e) {}
        setLoadingHistory(false);
      };

      const fetchOrdersForDate = async (dateStr) => {
        setLoadingHistory(true);
        setSelectedPastDate(dateStr);
        try {
          const res = await fetch(`/api/orders/date/${dateStr}`);
          const data = await res.json();
          if (data.success) setSelectedDateOrders(data.orders || []);
        } catch (e) {}
        setLoadingHistory(false);
      };

      const viewBillInNewTab = (orderId) => {
        window.open(`/api/orders/${orderId}/pdf`, '_blank');
      };

      const openWhatsAppBill = (order) => {
        const pdfUrl = `${window.location.protocol}//${window.location.host}/api/orders/${order.id}/pdf`;
        const text = encodeURIComponent(
          `🍊 *ORANGE CAFE - OFFICIAL BILL RECEIPT*\n` +
          `-------------------------------\n` +
          `Order ID: *${order.id}*\n` +
          `Customer: ${order.customerName || 'Valued Guest'}\n` +
          `Total Amount: *₹${order.grandTotal}*\n` +
          `Status: Paid\n\n` +
          `📄 *Download your PDF Bill Receipt:* ${pdfUrl}\n\n` +
          `Thank you for dining with us at Orange Cafe! Visit again soon.`
        );
        const cleanPhone = (order.phone || '').replace(/\D/g, '');
        if (cleanPhone.length >= 10) {
          window.open(`https://wa.me/91${cleanPhone}?text=${text}`, '_blank');
        } else {
          window.open(`https://wa.me/?text=${text}`, '_blank');
        }
      };

      const sendBillAndComplete = async (order) => {
        openWhatsAppBill(order);
        await updateStatus(order, 'completed');
      };

      const toggleStock = async (itemId, currentInStock) => {
        const nextInStock = !currentInStock;
        setStockMap(prev => ({ ...prev, [itemId]: nextInStock }));
        try {
          await fetch('/api/stock', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ itemId, inStock: nextInStock })
          });
        } catch (e) {
          fetchMenuAndStock();
        }
      };

      const printPosReceipt = (order) => {
        const sub = Number(order.subtotal || 0).toFixed(2);
        const disc = Number(order.bogoDiscount || 0).toFixed(2);
        const sc = Number(order.serviceCharge !== undefined ? order.serviceCharge : (order.taxes || 0)).toFixed(2);
        const gt = Number(order.grandTotal || 0).toFixed(2);
        const totalQty = (order.items || []).reduce((acc, i) => acc + i.quantity, 0);

        const printHtml = `
          <!DOCTYPE html>
          <html>
          <head>
            <title>Receipt - ${order.id}</title>
            <style>
              @page { size: 80mm auto; margin: 0; }
              body { font-family: monospace; width: 72mm; margin: 0 auto; padding: 10px 0; font-size: 11px; color: #000; }
              .center { text-align: center; }
              .bold { font-weight: bold; }
              .flex { display: flex; justify-content: space-between; }
              .border { border-top: 1px dashed #000; margin: 6px 0; }
              .item-row { margin-bottom: 4px; }
            </style>
          </head>
          <body>
            <div class="center bold" style="font-size: 14px;">ORANGE CAFE</div>
            <div class="center">GF-38, BAKROL SQUARE, BAKROL</div>
            <div class="center">V V NAGAR ANAND - 388115</div>
            <div class="center">Ph: 07623007043</div>
            <div class="border"></div>
            <div class="flex"><span>Order #: ${order.id}</span><span>${new Date(order.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div>
            <div class="flex"><span>Customer: ${order.customerName || 'Guest'}</span><span>${order.type === 'dine_in' ? 'T#' + (order.tableNumber || 1) : 'Online'}</span></div>
            <div class="flex"><span>Payment: ${order.paymentMethod || 'Cash (Paid)'}</span></div>
            <div class="border"></div>
            <div class="bold flex"><span>Item</span><span>Qty x Rate = Price</span></div>
            <div class="border"></div>
            ${(order.items || []).map(i => `
              <div class="item-row">
                <div>${i.name}</div>
                <div class="flex"><span></span><span>${i.quantity} x ₹${i.price} = ₹${i.quantity * i.price}</span></div>
              </div>
            `).join('')}
            <div class="border"></div>
            <div class="flex"><span>Total Qty:</span><span>${totalQty}</span></div>
            <div class="flex"><span>Sub Total:</span><span>₹${sub}</span></div>
            ${order.bogoDiscount > 0 ? `<div class="flex"><span>Discount (Fixed):</span><span>-₹${disc}</span></div>` : ''}
            <div class="flex"><span>Service Charge (10%):</span><span>₹${sc}</span></div>
            <div class="border"></div>
            <div class="flex bold" style="font-size: 12px;"><span>TOTAL PAYABLE:</span><span>₹${gt}</span></div>
            <div class="border"></div>
            <div class="center">Thank you! Please visit again.</div>
          </body>
          </html>
        `;
        const printWindow = window.open('', '_blank', 'width=400,height=600');
        printWindow.document.write(printHtml);
        printWindow.document.close();
        printWindow.focus();
        setTimeout(() => {
          try {
            printWindow.print();
          } catch(e) {}
        }, 300);
      };

      // Add New Item Workflow
      const handleCreateItemSubmit = async (e) => {
        e.preventDefault();
        let targetCategory = newItemForm.category;

        // If user entered a new category
        if (newItemForm.category === 'NEW_CAT' && newItemForm.newCategoryName.trim()) {
          const newCatSlug = newItemForm.newCategoryName.toLowerCase().replace(/[^a-z0-9]/g, '_');
          targetCategory = newCatSlug;
          await fetch('/api/menu/category', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: newCatSlug, name: `✨ ${newItemForm.newCategoryName}` })
          });
        }

        const payload = {
          name: newItemForm.name,
          category: targetCategory,
          price: Number(newItemForm.price),
          mediumPrice: newItemForm.mediumPrice ? Number(newItemForm.mediumPrice) : null,
          description: newItemForm.description,
          image: newItemForm.image,
          isBogoEligible: newItemForm.isBogoEligible,
          isVeg: newItemForm.isVeg
        };

        try {
          const res = await fetch('/api/menu/item', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.success) {
            setIsAddItemModalOpen(false);
            setNewItemForm({
              name: '', category: 'pizzas', newCategoryName: '', price: '', mediumPrice: '', description: '', image: '/assets/images/pizza.png', isBogoEligible: true, isVeg: true
            });
            fetchMenuAndStock();
          }
        } catch (e) {}
      };

      // Edit Item Workflow
      const handleEditItemSubmit = async (e) => {
        e.preventDefault();
        if (!editingItem) return;
        try {
          const res = await fetch(`/api/menu/item/${editingItem.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: editingItem.name,
              category: editingItem.category,
              price: Number(editingItem.price),
              mediumPrice: editingItem.mediumPrice ? Number(editingItem.mediumPrice) : null,
              description: editingItem.description,
              image: editingItem.image,
              isBogoEligible: editingItem.isBogoEligible,
              isVeg: editingItem.isVeg
            })
          });
          const data = await res.json();
          if (data.success) {
            setIsEditItemModalOpen(false);
            setEditingItem(null);
            fetchMenuAndStock();
          }
        } catch (e) {}
      };

      // 3-Step Safe Delete Item Workflow
      const handleExecuteDelete = async () => {
        if (!deleteTargetItem) return;
        if (deleteConfirmText.trim().toUpperCase() !== 'DELETE' && deleteConfirmText.trim().toLowerCase() !== deleteTargetItem.name.toLowerCase()) {
          alert('Security confirmation failed! Please type DELETE to confirm.');
          return;
        }
        try {
          const res = await fetch(`/api/menu/item/${deleteTargetItem.id}`, { method: 'DELETE' });
          const data = await res.json();
          if (data.success) {
            setDeleteTargetItem(null);
            setDeleteConfirmStep(1);
            setDeleteConfirmText('');
            fetchMenuAndStock();
          }
        } catch (e) {}
      };

      // Staff POS Order Cart Actions
      const addPosCartItem = (item, size = 'Regular') => {
        const itemPrice = size === 'Medium' && item.mediumPrice ? item.mediumPrice : item.price;
        const itemName = size === 'Medium' ? `${item.name} (Medium)` : item.name;
        const cartKey = `${item.id}-${size}`;

        setPosCart((prev) => {
          const existing = prev.find(i => i.cartKey === cartKey);
          if (existing) {
            return prev.map(i => i.cartKey === cartKey ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, { cartKey, id: item.id, name: itemName, price: item.price, itemPrice, size, quantity: 1, rawItem: item }];
        });
      };

      const updatePosCartQty = (cartKey, delta) => {
        setPosCart((prev) => {
          return prev.map(i => {
            if (i.cartKey === cartKey) {
              const newQ = i.quantity + delta;
              return newQ > 0 ? { ...i, quantity: newQ } : null;
            }
            return i;
          }).filter(Boolean);
        });
      };

      // Calculate Staff POS Totals with BOGO & Service Charge
      const calculatePosTotals = () => {
        const subtotal = posCart.reduce((sum, i) => sum + (i.itemPrice * i.quantity), 0);
        // Simple BOGO offer simulation for pizzas
        let bogoDiscount = 0;
        const bogoPizzas = [];
        posCart.forEach(i => {
          if (i.rawItem && i.rawItem.isBogoEligible) {
            for (let q = 0; q < i.quantity; q++) {
              bogoPizzas.push(i.itemPrice);
            }
          }
        });
        bogoPizzas.sort((a, b) => b - a);
        const freeCount = Math.floor(bogoPizzas.length / 2);
        for (let idx = 0; idx < freeCount; idx++) {
          bogoDiscount += bogoPizzas[bogoPizzas.length - 1 - idx];
        }

        const netSub = Math.max(0, subtotal - bogoDiscount);
        const serviceCharge = Math.round(netSub * 0.10 * 100) / 100;
        const grandTotal = netSub + serviceCharge;

        return { subtotal, bogoDiscount, serviceCharge, grandTotal };
      };

      const handlePOSOrderSubmit = async () => {
        if (posCart.length === 0) {
          alert('Please add at least 1 item to the POS order!');
          return;
        }

        const { subtotal, bogoDiscount, serviceCharge, grandTotal } = calculatePosTotals();

        const orderPayload = {
          id: `ORD-${Math.floor(100000 + Math.random() * 900000)}`,
          type: posOrderType,
          tableNumber: posOrderType === 'dine_in' ? Number(posTableNum) : null,
          customerName: posCustomerName.trim() || 'Walk-In Guest',
          phone: posPhone.trim(),
          paymentMethod: posPaymentMethod,
          subtotal,
          bogoDiscount,
          serviceCharge,
          grandTotal,
          items: posCart.map(i => ({ id: i.id, name: i.name, price: i.itemPrice, quantity: i.quantity })),
          status: 'preparing', // Staff POS orders go directly to kitchen prep
          createdAt: new Date().toISOString()
        };

        try {
          const res = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderPayload)
          });
          const data = await res.json();
          if (data.success) {
            alert(`✅ POS Order #${data.order.id} submitted to Kitchen!`);
            printPosReceipt(data.order);
            setPosCart([]);
            setPosCustomerName('Walk-In Customer');
            setPosPhone('');
            setOrderTypeFilter('all');
          }
        } catch (e) {
          alert('Error submitting POS order to server!');
        }
      };


      // LOGIN SCREEN (Light Theme)
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-amber-50 via-orange-50 to-amber-100">
            <div className="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200 shadow-xl space-y-6">
              <div className="text-center space-y-2">
                <img src="/assets/images/logo.png" alt="Logo" className="w-16 h-16 mx-auto object-contain drop-shadow" />
                <h1 className="font-heading font-extrabold text-2xl text-slate-900 tracking-tight">ORANGE CAFE</h1>
                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Kitchen Staff Portal</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Staff Access PIN (Default: 1234)</label>
                  <input
                    type="password"
                    maxLength="4"
                    value={pin}
                    onChange={(e) => { setPin(e.target.value); setLoginError(''); }}

                </form>
              </div>
            </div>
          )}

          {/* EDIT MENU ITEM MODAL */}
          {isEditItemModalOpen && editingItem && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 border border-slate-200 shadow-2xl space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                  <h3 className="font-heading font-extrabold text-xl text-slate-900">✏️ Edit Item: {editingItem.name}</h3>
                  <button onClick={() => setIsEditItemModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                </div>

                <form onSubmit={handleEditItemSubmit} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 uppercase mb-1">Item Name</label>
                    <input
                      type="text"
                      required
                      value={editingItem.name}
                      onChange={(e) => setEditingItem({ ...editingItem, name: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-300 font-semibold"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Price (Regular) ₹</label>
                      <input
                        type="number"
                        required
                        value={editingItem.price}
                        onChange={(e) => setEditingItem({ ...editingItem, price: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-300 font-bold text-orange-600"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Medium Price ₹</label>
                      <input
                        type="number"
                        value={editingItem.mediumPrice || ''}
                        onChange={(e) => setEditingItem({ ...editingItem, mediumPrice: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-300 font-bold text-orange-600"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 uppercase mb-1">Description</label>
                    <textarea
                      rows="2"
                      value={editingItem.description || ''}
                      onChange={(e) => setEditingItem({ ...editingItem, description: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-300 font-medium"
                    ></textarea>
                  </div>

                  <div className="pt-3 border-t border-slate-200 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsEditItemModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-extrabold shadow-md">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 3-STEP SAFE DELETE MODAL */}
          {deleteTargetItem && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 border border-red-200 shadow-2xl space-y-4">
                <div className="text-center space-y-2">
                  <div className="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto text-2xl">
                    ⚠️
                  </div>
                  <h3 className="font-heading font-extrabold text-xl text-red-900">Critical Action: Delete Menu Item</h3>
                  <p className="text-xs text-slate-600">
                    Are you sure you want to permanently remove <strong className="text-slate-900">{deleteTargetItem.name}</strong> from the menu?
                  </p>
                </div>

                <div className="bg-red-50 p-4 rounded-2xl border border-red-200 text-xs text-red-800 space-y-2">
                  <p className="font-bold">Security Safeguard (Step {deleteConfirmStep} of 2):</p>
                  <p>Type <strong className="font-mono underline">DELETE</strong> below to confirm deletion:</p>
                  <input
                    type="text"
                    placeholder="Type DELETE..."
                    value={deleteConfirmText}
                    onChange={(e) => setDeleteConfirmText(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-white border border-red-300 font-bold text-red-900 uppercase focus:outline-none focus:ring-2 focus:ring-red-500"
                  />
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => { setDeleteTargetItem(null); setDeleteConfirmText(''); }}
                    className="w-1/2 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleExecuteDelete}
                    disabled={deleteConfirmText.trim().toUpperCase() !== 'DELETE'}
                    className="w-1/2 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-extrabold text-xs shadow-md disabled:opacity-40 disabled:cursor-not-allowed"
                  >
                    Permanently Delete
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StaffApp />);
  </script>
</body>
</html>
